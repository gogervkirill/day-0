<style>
:root{
  --bg:#0a0c0b;--panel:#121614;--panel2:#1a201d;--panel3:#222a26;--line:#2a332e;--line2:#36413b;
  --text:#e4ebe2;--dim:#8d9a90;--acc:#e3ad3c;--acc2:#f3c766;--good:#62c774;--bad:#e8574a;--ai:#4fb3e8;--gang:#e8574a;
  --glass:rgba(14,17,16,.72);--shadow:0 8px 28px rgba(0,0,0,.45);--r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.38 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#mapWrap{position:relative;flex:1;min-height:0}
canvas#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(10px) saturate(1.2);backdrop-filter:blur(10px) saturate(1.2);border:1px solid rgba(255,255,255,.07);box-shadow:var(--shadow)}
#hud{position:absolute;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:7px;pointer-events:none}
.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-radius:var(--r);padding:8px 10px}
.bar{font-size:11px;color:var(--dim);display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:5px}
.bar b{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;font-size:12.5px;justify-self:end}
.bar i{grid-column:1/-1;display:block;height:6px;border-radius:6px;background:rgba(255,255,255,.07);margin-top:4px;overflow:hidden}
.bar i s{display:block;height:100%;width:50%;text-decoration:none;border-radius:6px;transition:width .6s ease;box-shadow:0 0 8px currentColor}
.bar.low b{color:var(--bad);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.45}}
.cellinfo{align-self:flex-start;border-radius:999px;padding:6px 12px;font-size:12px;max-width:100%;line-height:1.3}
.cellinfo .t{color:var(--acc2);font-weight:700}
#eventBar{border-color:rgba(232,87,74,.6)!important;color:#ffd9d4}
#tools{position:absolute;right:10px;bottom:28px;display:flex;flex-direction:column;gap:10px}
.fab{width:48px;height:48px;border-radius:50%;color:var(--text);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .12s}
.fab:active{transform:scale(.92)}
.fab.on{color:var(--acc);box-shadow:0 0 0 2px var(--acc),var(--shadow)}
#attrib{position:absolute;left:8px;bottom:22px;font-size:9.5px;color:#7c887f;pointer-events:none;text-shadow:0 1px 2px #000}
#progress{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:var(--r);padding:12px 16px;min-width:220px;display:none;text-align:center;font-weight:600}
#progress .pb{height:7px;background:rgba(255,255,255,.08);border-radius:7px;margin-top:9px;overflow:hidden}
#progress .pb s{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;text-decoration:none;box-shadow:0 0 10px var(--acc)}
#progress button{margin-top:9px}
#sheet{position:relative;z-index:2;margin-top:-16px;background:linear-gradient(180deg,#161b18,var(--panel) 60px);border-top:1px solid var(--line2);border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.5);height:42%;max-height:360px;min-height:230px;display:flex;flex-direction:column}
#sheet:before{content:"";position:absolute;left:50%;top:6px;width:38px;height:4px;border-radius:4px;background:var(--line2);transform:translateX(-50%)}
#tabs{display:flex;gap:2px;padding:14px 8px 6px}
#tabs button{flex:1;background:none;border:0;color:var(--dim);padding:6px 2px;font-size:11px;cursor:pointer;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:background .15s,color .15s}
#tabs button .ti{font-size:18px;line-height:1.1;filter:grayscale(.6);opacity:.8;transition:filter .15s,opacity .15s}
#tabs button.on{color:var(--acc2);background:rgba(227,173,60,.12)}
#tabs button.on .ti{filter:none;opacity:1}
#pane{flex:1;overflow:auto;padding:6px 12px 12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
#pane::-webkit-scrollbar,#mbox::-webkit-scrollbar{width:4px}#pane::-webkit-scrollbar-thumb,#mbox::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
.btn{position:relative;background:linear-gradient(180deg,var(--panel3),var(--panel2));border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;cursor:pointer;text-align:left;transition:transform .1s,border-color .15s,background .15s;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.38;cursor:default}
.btn.acc{border-color:rgba(227,173,60,.7);color:var(--acc2);background:linear-gradient(180deg,rgba(227,173,60,.16),rgba(227,173,60,.06))}
.btn.bad{border-color:rgba(232,87,74,.7);color:#ff8a7e;background:linear-gradient(180deg,rgba(232,87,74,.14),rgba(232,87,74,.05))}
.btn small{display:block;color:var(--dim);font-size:11px;margin-top:2px;font-weight:400}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .n{flex:1;min-width:0}
.row .n small{display:block;color:var(--dim);font-size:11px}
.mini{padding:6px 11px;font-size:12px;border-radius:9px}
b{font-weight:700}
#pane > b, .box > b{display:block;margin:10px 0 4px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.log div{padding:5px 0 5px 10px;border-left:2px solid var(--line);margin:2px 0;font-size:12.5px}
.log .tm{color:var(--dim);margin-right:6px;font-variant-numeric:tabular-nums;font-size:11px}
.log div:has(.g){border-left-color:var(--good)}.log div:has(.b){border-left-color:var(--bad)}.log div:has(.a){border-left-color:var(--acc)}
.log .g{color:var(--good)}.log .b{color:#ff8a7e}.log .a{color:var(--acc2)}
.dist{margin-bottom:9px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.dist .h{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:600}
.dist i{display:block;height:6px;background:rgba(255,255,255,.07);border-radius:6px;margin-top:6px;overflow:hidden}
.dist i s{display:block;height:100%;background:linear-gradient(90deg,#3f9d50,var(--good));text-decoration:none;border-radius:6px}
.muted{color:var(--dim);font-size:12px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:10;padding:0}
#modal .box{position:relative;background:linear-gradient(180deg,#181e1b,var(--panel) 80px);border:1px solid var(--line2);border-bottom:0;border-radius:22px 22px 0 0;padding:20px 16px max(16px,env(safe-area-inset-bottom));width:100%;max-width:460px;max-height:86vh;overflow:auto;box-shadow:0 -12px 40px rgba(0,0,0,.6);animation:up .22s cubic-bezier(.2,.9,.3,1.1)}
#modal .box:before{content:"";position:absolute;left:50%;top:7px;width:38px;height:4px;border-radius:4px;background:var(--line2);transform:translateX(-50%)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:700px){#modal{align-items:center;padding:16px}#modal .box{border-radius:20px;border-bottom:1px solid var(--line2)}}
#modal h3{margin:0 0 8px;font-size:18px;letter-spacing:.01em}
#modal .acts{display:grid;gap:8px;margin-top:14px}
.hpline{display:flex;gap:10px;font-size:13px;margin:6px 0}
.clog{max-height:110px;overflow:auto;font-size:12.5px;color:var(--dim);border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
#toast{position:absolute;left:50%;top:104px;transform:translateX(-50%);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;display:none;max-width:90%;text-align:center;pointer-events:none;animation:tin .25s ease}
@keyframes tin{from{transform:translate(-50%,-8px);opacity:0}}
select,input,textarea{font:inherit}
</style>
</head>

const EN_PER_CELL = 2;
const RESPAWN = 20 * 60e3;      // восстановление лута
const SCAN_R = 3;

function reveal(i, j, r, scout) {
  for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++) {
    const a = i + di, b = j + dj; if (!inGrid(a, b) || !inCity[b * GW + a]) continue;

}
let route = null, pendingPath = null;   // маршрут: {path: [[i,j],…], k — сколько клеток пройдено}
function findPath(i0, j0, i1, j1) {      // поиск в ширину по клеткам города (8 направлений), вода и края непроходимы
  if (!inCity[j1 * GW + i1]) return null;
  const prev = new Int32Array(N).fill(-1), q = new Int32Array(N); let h = 0, t = 0; const s0 = j0 * GW + i0, s1 = j1 * GW + i1;
  prev[s0] = s0; q[t++] = s0;

  while (h < t) { const c = q[h++]; if (c === s1) break; const ci = c % GW, cj = (c - ci) / GW;
    for (const [di, dj] of dirs) { const a = ci + di, b = cj + dj; if (a < 0 || b < 0 || a >= GW || b >= GH) continue; const n = b * GW + a;
      if (prev[n] >= 0 || !inCity[n]) continue; prev[n] = c; q[t++] = n; } }
  if (prev[s1] < 0) return null;
  const path = []; for (let c = s1; c !== s0; c = prev[c]) path.push([c % GW, Math.floor(c / GW)]);
  return path.reverse();
}
function legTo(i, j, d, quiet) {         // один переход на d клеток; "en" — не хватило энергии
  let cost = d * EN_PER_CELL, speed = 1;
  if (carOn()) { if (S.tank < d * .25) { toast("Мало бензина: нужно " + d * .25); return false; } S.tank -= d * .25; cost = 0; speed = 3; }
  else if (S.vehicle === "bike") { cost = d; speed = 2; }
  if (S.p.en < cost) { if (!quiet) toast("Не хватает энергии (" + cost + ")"); return "en"; }
  S.p.en -= cost; resting = false;
  travel = {fi: S.p.i, fj: S.p.j, ti: i, tj: j, t0: Date.now(), dur: d * SEC_PER_CELL * 1000 / speed};
  S.p.i = i; S.p.j = j; // целевая клетка; анимация из travel
  renderPane(); return true;
}
function routeNext() {
  if (!route || busy || fight || travel || document.getElementById("modal").style.display === "flex") return;
  const rest = route.path.length - route.k;
  if (rest <= 0) { route = null; toast("📍 Вы на месте"); renderAll(); return; }
  const n = Math.min(moveR(), rest), [i, j] = route.path[route.k + n - 1], r = legTo(i, j, n, true);
  if (r === true) { route.k += n; route.rest = false; }
  else if (r === "en") { if (!route.rest) { route.rest = true; toast("😮‍💨 Привал: коплю силы, пойду дальше сам"); renderPane(); } }
  else { route = null; renderAll(); }
}
function startRoute() { if (!pendingPath) return; route = {path: pendingPath, k: 0}; pendingPath = null; closeModal(); routeNext(); renderAll(); }
function stopRoute(why) { if (route) { route = null; if (why) toast(why); renderAll(); } }
function onTap(sx, sy) {

  if (!inGrid(i, j)) return;
  if (!inCity[j * GW + i]) { if (luOf(i, j) === "W") toast("Там вода"); return; }
  if (devTool && devOn()) { devTap(i, j); return; }
  if (pickMode) { pickTarget(i, j); return; }
  if (i === S.p.i && j === S.p.j) { if (route) stopRoute("Маршрут остановлен"); setTab("act"); return; }
  const c = S.cells[key(i, j)];
  if (S.gps) { toast(c && c.e ? describe(i, j) : "Неизвестная территория"); return; }
  if (fight || busy) { toast("Сейчас занят"); return; }

  if (d <= moveR() && !travel && !route) { legTo(i, j, d); return; }

  const cost = carOn() ? (path.length * .25) + " бензина" : (S.vehicle === "bike" ? path.length : path.length * EN_PER_CELL) + "⚡";
  const z = zoneFaction(i, j); pendingPath = path;

    <p class="muted">${c && c.e ? describe(i, j) : DISTRICTS[distOf[j * GW + i]].n + " район · не разведано"}</p>${c && c.e && cellBase(i, j).poi ? placeHtml(cellBase(i, j).poi, c.o) : ""}
    <p>Путь: <b>${path.length} кл.</b> (${(path.length * CELL_REAL / 1000).toFixed(1)} км) · около <b>${sec >= 90 ? Math.round(sec / 60) + " мин" : sec + " с"}</b> · ${cost}${z ? ` · <span style="color:var(--bad)">${z === "ai" ? "зона ИИ" : "зона банды"}</span>` : ""}</p>
    <p class="muted">Персонаж пойдёт сам. Если кончатся силы — сделает привал и продолжит. Если заметит враг или начнётся бой — остановится.</p>
    <div class="acts"><button class="btn acc" onclick="startRoute()">Идти сюда</button><button class="btn" onclick="pendingPath=null;closeModal()">Отмена</button></div>`);
}
function arrive() {
  travel = null; enterCell(S.p.i, S.p.j); if (route) centerOnPlayer(); routeNext();
}
function enterCell(i, j) {

  const first = !c.e;
  const fresh = !c.v; if (fresh) { c.v = 1; S.stat.cells = (S.stat.cells || 0) + 1; gainXp(1); }   // опыт за новые места

const streetCache = new Map();
function streetOf(i, j) {   // ближайшая именованная улица в пределах ~клетки
  const k = key(i, j); if (streetCache.has(k)) return streetCache.get(k);
  const [x, y] = cellCenter(i, j); let best = null, bd = CELL * .8;
  for (const [n, pts] of STREETS_M) { if (!n) continue;
    for (let q = 1; q < pts.length; q++) { const [ax, ay] = pts[q - 1], [bx, by] = pts[q], dx = bx - ax, dy = by - ay;
      if (Math.min(ax, bx) - bd > x || Math.max(ax, bx) + bd < x || Math.min(ay, by) - bd > y || Math.max(ay, by) + bd < y) continue;

      if (d < bd) { bd = d; best = n; } } }
  streetCache.set(k, best); return best;
}
function describe(i, j) {

  const z = zoneFaction(i, j);

const buzz = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

/* ----- инвентарь ----- */
const weight = () => Object.entries(S.inv).reduce((a, [k, n]) => a + ITEMS[k].w * n, 0) + (S.vest ? ITEMS.vest.w : 0);
function addItem(k, n) {
  const room = Math.floor((maxW() - weight()) / ITEMS[k].w + 1e-9);
  const take = Math.max(0, Math.min(n, room));
  if (take > 0) S.inv[k] = (S.inv[k] || 0) + take;
  return take;
}
function useItem(k) {
  const it = ITEMS[k]; if (!S.inv[k]) return;
  if (it.use) {
    if (it.use.food) S.p.food = Math.min(100, S.p.food + it.use.food);
    if (it.use.water) S.p.water = Math.min(100, S.p.water + it.use.water);
    if (it.use.hp) S.p.hp = Math.min(100, S.p.hp + it.use.hp);
    dec(k); log("Использовано: " + it.n);
  } else if (it.dmg) { S.weapon = k; log("Оружие: " + it.n); }
  else if (k === "vest") { if (!S.vest) { dec(k); S.vest = true; log("Надет бронежилет", "g"); } }
  renderAll(); save();
}
function dec(k, n = 1) { S.inv[k] -= n; if (S.inv[k] <= 0) { delete S.inv[k]; if (S.weapon === k) S.weapon = null; } }
function dropItem(k) { dec(k); renderAll(); save(); }
function craftEmp() {

  dec("parts", 4); dec("batt", 2); S.inv.emp = (S.inv.emp || 0) + 1; log("Собрана ЭМИ-граната", "g"); renderAll(); save();
}
function playerDmg() { const r = rawDmg(); r.d = Math.round(r.d * (1 + .15 * pk("fight")) * (ctl("military") ? 1.2 : 1)); return r; }
function rawDmg() {
  const w = S.weapon && S.inv[S.weapon] ? ITEMS[S.weapon] : null;
  if (!w) return {d: rnd(3, 6), n: "кулаки"};
  if (w.ammo) { if ((S.inv[w.ammo] || 0) > 0) { dec(w.ammo); return {d: rnd(w.dmg - 4, w.dmg + 4), n: w.n}; } return {d: rnd(4, 7), n: w.n + " (без патронов)"}; }

}

  if (busy || travel || fight) return;
  if (S.p.en < en) { toast("Не хватает энергии (" + en + ")"); return; }
  S.p.en -= en; resting = false;
  busy = {label, t0: Date.now(), dur: sec * 1000, done, i: S.p.i, j: S.p.j};
  showProgress(); renderAll();
}
function cancelBusy() { busy = null; hideProgress(); renderAll(); }
function showProgress() { document.getElementById("progress").style.display = "block"; document.getElementById("pText").textContent = busy.label; }
function hideProgress() { document.getElementById("progress").style.display = "none"; }

function lootLeft(c) { if (c.ls && Date.now() - c.ls >= RESPAWN) { c.lc = 0; } return 3 - (c.lc || 0); }
function actSearch() {
  const k = key(S.p.i, S.p.j), c = C(k);
  if (lootLeft(c) <= 0) return;
  startBusy("Обыск…", 8, 8, () => {
    const b = cellBase(S.p.i, S.p.j); const table = LOOT[b.t] || LOOT.res;
    c.lc = (c.lc || 0) + 1; c.ls = Date.now(); bump("search");
    const found = [];
    const rolls = (Math.random() < .25 ? 0 : rnd(1, b.poi ? 3 : 2)) + (Math.random() < .2 * pk("loot") ? 1 : 0);
    for (let r = 0; r < rolls; r++) {
      const tot = table.reduce((a, x) => a + x[1], 0); let v = Math.random() * tot;
      for (const [it, w, mn, mx] of table) { v -= w; if (v <= 0) { const got = addItem(it, rnd(mn, mx)); if (got) found.push(ITEMS[it].n + (got > 1 ? " ×" + got : "")); else found.push("(нет места: " + ITEMS[it].n + ")"); break; } }
    }
    log(found.length ? "Найдено: " + found.join(", ") : "Ничего полезного", found.length ? "g" : ""); toast(found.length ? "🔍 " + found.join(", ") : "🔍 Ничего полезного");

    else if (Math.random() < .03) offerSurvivor(newSurvivor(), "Под завалом кто-то живой! Вы помогаете выбраться.", null);

}

      const a = S.p.i + di, b = S.p.j + dj; if (inGrid(a, b) && inCity[b * GW + a] && baseTrap(a, b) && !(S.cells[key(a, b)] || {}).td) traps.push(1); }

function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);

const depoCache = new Map();

  const s = DEPO_SEED[d], n = vnoise(i / 7, j / 7, s) * .75 + vnoise(i / 2.3, j / 2.3, s + 5) * .25;
  const n2 = Math.max(0, Math.min(1, (n - .28) / .44));   // растягиваем контраст: шум кучкуется у 0.5
  q = Math.max(.05, Math.min(1, Math.pow(n2, 1.3) * .85 + (DEPO[d].t[cellBase(i, j).t] || 0)));
  depoCache.set(ck, q); return q;
}
const qMult = q => .4 + 1.6 * q;  // 5% → ×0.48, 50% → ×1.2, 100% → ×2
const pct = q => Math.round(q * 100) + "%";

/* ----- сканер ----- */

const SCAN_DEPO_R = 6;

/* ----- живой сканер: тепловая карта выбранного ресурса вокруг игрока; импульс (батарейка) — шире и на 10 минут ----- */
const liveR = () => 4 + coreLv("sight") + 2 * ctl("tower");

    if (!inGrid(a, b) || !inCity[b * GW + a] || safeCell(a, b)) continue; const q = depoQ(a, b, sc.d); if (!best || q > best.q) best = {q, a, b}; }

}

  if (b.a === S.p.i && b.b === S.p.j) { toast("Вы уже на лучшей точке"); return; }

const heatC = document.createElement("canvas"), heatX = heatC.getContext("2d");
function drawHeat(sc, cs, now) {
  const n = 2 * sc.r + 1; if (heatC.width !== n) heatC.width = heatC.height = n;
  const img = heatX.createImageData(n, n), d = img.data, pulse = .88 + .12 * Math.sin(now / 450);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { const a = sc.i - sc.r + x, b = sc.j + sc.r - y, o = (y * n + x) * 4;
    if (!inGrid(a, b) || !inCity[b * GW + a]) continue; const q = depoQ(a, b, sc.d);
    const fall = Math.max(0, Math.min(1, (sc.r + .6 - Math.hypot(a - sc.i, b - sc.j)) / 1.6));
    d[o] = q < .5 ? 232 : 232 - (q - .5) * 2 * 140; d[o + 1] = q < .5 ? 87 + q * 2 * 110 : 197 + (q - .5) * 2 * 40; d[o + 2] = 74 + (q > .75 ? 40 : 0);
    d[o + 3] = (25 + q * q * 190) * fall * pulse; }
  heatX.putImageData(img, 0, 0);

  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high"; ctx.drawImage(heatC, sx, sy, n * cs, n * cs);
  // кольцо зоны сканирования

  ctx.beginPath(); ctx.arc(cx, cy, rr * ph, 0, 7); ctx.strokeStyle = `rgba(79,179,232,${.5 * (1 - ph)})`; ctx.lineWidth = 2; ctx.stroke();
  ctx.textAlign = "center"; ctx.textBaseline = "middle";

    if (!inGrid(a, b) || !inCity[b * GW + a] || Math.hypot(di, dj) > sc.r + .3) continue; const q = depoQ(a, b, sc.d), [x, y] = toScr(...cellCenter(a, b));
    ctx.font = "700 " + Math.min(15, cs * .2) + "px system-ui"; ctx.fillStyle = "rgba(0,0,0,.6)"; ctx.fillText(pct(q), x + 1, y - cs * .32 + 1); ctx.fillStyle = q >= .7 ? "#b9ffc4" : q >= .4 ? "#ffe2a0" : "#ffb4ac"; ctx.fillText(pct(q), x, y - cs * .32); }
  const b = scanBest(sc); if (b && cs > 8) { const [x, y] = toScr(...cellCenter(b.a, b.b)); badge(x, y - cs * .05, Math.max(9, Math.min(15, cs * .26)), DEPO[sc.d].i, "#62c774", 12); }
}

/* ----- ручной сбор ресурса с богатой клетки ----- */
const GATHER = {soil: ["veg", 1], water: ["water", 1], scrap: ["parts", 1], grid: ["batt", 1], meds: ["band", 1], cache: ["ammo", 3]};
const GATHER_CD = 15 * 60e3, GATHER_MIN = .5;
function gatherHere() {            // что можно собрать на клетке игрока: выбранный в сканере ресурс, иначе самый богатый
  const i = S.p.i, j = S.p.j; if (safeCell(i, j)) return null;
  let d = S.scanOn && depoQ(i, j, S.scanD || "scrap") >= GATHER_MIN ? S.scanD || "scrap" : null;
  if (!d) d = Object.keys(DEPO).reduce((a, k) => depoQ(i, j, k) > depoQ(i, j, a) ? k : a);
  const q = depoQ(i, j, d), [it, per] = GATHER[d]; return {d, q, it, n: (1 + Math.floor(q * 3)) * per};
}

  startBusy(`Сбор: ${DEPO[g.d].n}…`, 10, 8, () => {
    const got = addItem(g.it, g.n); c.gt = Date.now(); bump("gather"); gainXp(2);
    log(got ? `⛏ ${DEPO[g.d].n} (${pct(g.q)}): ${ITEMS[g.it].n} ×${got}` : "Рюкзак полон", got ? "g" : "b"); toast(got ? `⛏ ${ITEMS[g.it].n} ×${got}` : "Рюкзак полон");
  });
}

/* ----- износ построек ----- */

  const w = c.b.w || c.b.ready, wh = c.b.wh === undefined ? 100 : c.b.wh;

}

  if (!n || !canPay({parts: n})) return; closeModal();
  startBusy("Ремонт…", 5, 5, () => { if (!canPay({parts: n})) return; pay({parts: n}); c.b.w = Date.now(); c.b.wh = 100; log(`🔧 ${BUILD[c.b.t].n} отремонтирован(а): −${n} деталей`, "g"); });
}

  S.money -= m; c.b.w = Date.now(); c.b.wh = 100; log(`🔧 Бригада лагеря отремонтировала ${BUILD[c.b.t].n}: −${m} 💰`, "g"); renderAll(); save();
}

/* ----- барахолка: плавающие цены, дефицит ----- */
const MKT_BUY = ["can","veg","water","rusk","band","medkit","parts","batt","rebar","ammo","fuel","akb","mask","emp","trap","molotov","vest","pistol"];

  const m = S.mkt || (S.mkt = {}); for (const k in m) { m[k] += (1 - m[k]) * (1 - Math.pow(.99, mins)); if (Math.abs(m[k] - 1) < .01) delete m[k]; }
  if (!S.deficit || now >= S.deficit.until) { const k = pick(MKT_BUY.slice(0, 12)); S.deficit = {k, until: now + 60 * 60e3}; log(`🛒 На барахолке дефицит: ${ITEMS[k].n} — платят ×1.6`, "a"); }
}

    <b>Продать</b>${sell || '<p class="muted">рюкзак пуст</p>'}<b style="display:block;margin-top:8px">Купить</b>${buy}<div class="acts"><button class="btn" onclick="closeModal();renderAll()">Закрыть</button></div>`);

/* ----- постройки на своих клетках (в духе Resources: строятся в реальном времени, копят продукцию) ----- */
// g: raw — добывает сырьё; proc — цех, перерабатывает (берёт сырьё из своего бункера и у соседних построек); def — защита; hq — штаб
const BUILD = {

  gen:    {g:"raw", n:"Генератор",   i:"🔋", d:"заряжает батарейки",                 cost:{parts:8, akb:1},     out:"batt",  every:20, cap:4, depo:"grid"},

  turret: {g:"def", n:"Самострел",   i:"🎯", d:"набеги на эту и соседние клетки отбиваются всегда", cost:{parts:12, batt:4, ammo:10}},
  dorm:   {g:"spec",n:"Жилой блок",      i:"🏘", d:"+3 места для выживших за уровень", cost:{parts:10, rebar:2}},
  hq:     {g:"hq",  n:"Штаб",        i:"🏢", d:"один на игрока; постройки в радиусе 5 кл. работают быстрее: +25% за уровень", cost:{parts:20, batt:5, money:40}},
};
const B_GROUPS = [["raw", "Добыча: копит ресурсы, забирать на месте"], ["def", "Оборона"], ["spec", "Жильё"], ["hq", "Особое"]];

const HQ_R = 5;
const bCost = (t, lv) => Object.fromEntries(Object.entries(BUILD[t].cost).map(([k, n]) => [k, n * lv]));

}
const costTxt = cost => Object.entries(cost).map(([k, n]) => `<span style="color:${have(k) >= n ? "var(--text)" : "var(--bad)"}">${itName(k)} ${have(k)}/${n}</span>`).join(" · ");
const bWorking = (c, now = Date.now()) => c && c.b && c.o && now >= c.b.ready;            // достроена и клетка ваша
const bLv = (c, now = Date.now()) => !c || !c.b ? 0 : now >= c.b.ready ? c.b.lv : c.b.lv - 1;  // при апгрейде — старый уровень
const kij = k => k.split(",").map(Number);
function hqCell() { for (const k in S.cells) if (S.cells[k].b && S.cells[k].b.t === "hq") return k; return null; }

  const [a, b] = kij(k); return cheb(a, b, i, j) <= HQ_R ? 1 + .25 * c.b.lv : 1;
}
function bEvery(k) {   // интервал выработки: база / (штаб × качество залежи × состояние)

function bldEventTick(now) {

  const all = Object.keys(S.cells).filter(k => bWorking(S.cells[k], now)); if (all.length < 2 || Math.random() > .15) return;
  const t = pick(["fire", "fire", "strike", "quake"]);

    const pool = all.filter(k => BUILD[S.cells[k].b.t].g === "raw"); if (!pool.length) return;
    const k = pick(pool), c = S.cells[k], [i, j] = kij(k);
    if (workers(c).length && Math.random() < .6) { log(`🔥 Пожар на «${BUILD[c.b.t].n}» потушили работники: ${workers(c).map(m => m.n).join(", ")}`, "g"); return; }
    hurtBuilding(c, rnd(25, 40), now); if (BUILD[c.b.t].g === "proc") c.b.st = 0; else c.b.y = now;
    log(`🔥 Пожар: ${BUILD[c.b.t].n} (${cellBase(i, j).n}) — продукция сгорела, состояние ${Math.floor(bCond(c))}%`, "b"); toast("🔥 Пожар на постройке");
  } else if (t === "strike") {
    const pool = all.filter(k => ["gen", "tower", "hq", "turret"].includes(S.cells[k].b.t)); if (!pool.length) return;
    const k = pick(pool), c = S.cells[k], [i, j] = kij(k);
    if (gCount(c.g) && Math.random() < .5) { log(`🛸 Охрана отогнала дроны ИИ от «${BUILD[c.b.t].n}»`, "g"); return; }
    hurtBuilding(c, rnd(30, 45), now); log(`🛸 Удар дронов ИИ по «${BUILD[c.b.t].n}» (${cellBase(i, j).n}): состояние ${Math.floor(bCond(c))}%`, "b"); toast("🛸 Дроны ударили по постройке");
  } else quakeBuildings(kij(pick(all)), now);
  dirty = true; save();
}
function quakeBuildings([ci, cj], now = Date.now()) {
  let n = 0; for (const k in S.cells) { const c = S.cells[k]; if (!bWorking(c, now)) continue; const [i, j] = kij(k); if (cheb(i, j, ci, cj) > 5) continue;
    hurtBuilding(c, Math.round(rnd(15, 30) * (workers(c).length ? .5 : 1)), now); n++; }
  if (n) { log(`⚡ Толчок у ${cellBase(ci, cj).n}: повреждено построек — ${n}`, "b"); toast("⚡ Толчок: постройки повреждены"); }
}

/* ----- тайники с ломом и переработка ----- */
const JUNK = [["cable", 25], ["tires", 20], ["boards", 18], ["coins", 22], ["watch", 6], ["ring", 1], ["parts", 10], ["batt", 6]];
const RECYCLE = {cable: {parts: 2}, tires: {parts: 3}, boards: {batt: 2}, watch: {parts: 1, batt: 1}};
function cacheTick(now) {
  S.caches = (S.caches || []).filter(c => now < c.until);
  if (S.caches.length >= 3 || Math.random() > .08) return;
  const c = randCellAt(4, 10, (a, b) => !safeCell(a, b) && !nearCamp(a, b)); if (!c) return;
  S.caches.push({i: c[0], j: c[1], until: now + 60 * 60e3}); dirty = true;
}
function cacheOnEnter(i, j) {
  const x = (S.caches || []).findIndex(c => c.i === i && c.j === j); if (x < 0) return;
  S.caches.splice(x, 1); const got = {}, tot = JUNK.reduce((a, [, w]) => a + w, 0);
  for (let n = rnd(2, 3) + coreLv("loot"); n > 0; n--) { let r = Math.random() * tot, it = JUNK[0][0]; for (const [k, w] of JUNK) { if ((r -= w) < 0) { it = k; break; } }
    const g = addItem(it, it === "coins" ? rnd(2, 5) : 1); if (g) got[it] = (got[it] || 0) + g; }
  const txt = Object.entries(got).map(([k, n]) => ITEMS[k].n + (n > 1 ? " ×" + n : "")).join(", ");
  log("🧰 Тайник вскрыт: " + (txt || "рюкзак полон"), txt ? "g" : "b"); gainXp(3);
}
function recycle(it) {
  const c = S.cells[key(S.p.i, S.p.j)]; if (!c || !c.b || c.b.t !== "recycler" || !S.inv[it] || !RECYCLE[it]) return;
  const m = 1 + .25 * (bLv(c) - 1) + .15 * coreLv("synth"); dec(it);
  const out = Object.entries(RECYCLE[it]).map(([k, n]) => { const q = Math.max(1, Math.round(n * m)); const g = addItem(k, q); if (g < q) S.stash[k] = (S.stash[k] || 0) + q - g; return ITEMS[k].n + " ×" + q; });
  log(`♻ ${ITEMS[it].n} → ${out.join(", ")}`, "g"); save(); openBuild();
}

/* ----- ядра «Тұмар» (аналог артефактов): пеленг, сужение зоны ходьбой, вскрытие ----- */

const BANDS = [[0, 0, "ЗДЕСЬ"], [1, 3, "очень близко"], [4, 8, "близко"], [9, 15, "средне"], [16, 99, "далеко"]];
const DIRS = ["С", "СВ", "В", "ЮВ", "Ю", "ЮЗ", "З", "СЗ"];
function huntPing() {
  const now = Date.now();

  startBusy("Пеленг сигнала ИИ…", 4, 4, () => {
    if (!S.hunt) { const c = randCellAt(10, 20, (a, b) => !safeCell(a, b)); if (!c) { toast("Сигнала нет"); return; }
      S.hunt = {i: c[0], j: c[1], until: Date.now() + 2 * 3600e3, pings: []}; log("🧿 Пойман сигнал ядра «Тұмар». Ходите и пеленгуйте, чтобы сузить зону поиска.", "a"); }

    const ang = Math.atan2(h.j - S.p.j, h.i - S.p.i), dir = DIRS[(Math.round((Math.PI / 2 - ang) / (Math.PI / 4)) % 8 + 8) % 8];
    h.pings.push({i: S.p.i, j: S.p.j, b: band}); if (h.pings.length > 6) h.pings.shift();
    if (band === 0) { if (!h.found) { h.found = Date.now(); for (let n = 0; n < 2; n++) { const e = spawnEnt("drone", S.p.i + pick([-1, 1]), S.p.j + rnd(-1, 1)); e.aggro = true; } }
      log("🧿 Ядро прямо под вами! 15 минут на вскрытие. Охранные дроны проснулись.", "b"); toast("🧿 Ядро найдено!"); }
    else log(`🧿 Сигнал: ${BANDS[band][2]}${band >= 2 ? ", примерно " + dir : ""}`, "a");
  });
}
function huntOpen() {
  const h = S.hunt; if (!h || !h.found || h.i !== S.p.i || h.j !== S.p.j) return;

    if (Math.random() < ch) { const id = pick(Object.keys(CORES)); S.cores = S.cores || {}; const up = coreLv(id) < 3; if (up) S.cores[id] = coreLv(id) + 1; else S.money += 80;
      log(`✨ Добыто: ${CORES[id].n}${up ? " ур. " + S.cores[id] + " — " + CORES[id].d : " (уже максимум, продано за 80 💰)"}`, "g"); toast("✨ " + CORES[id].n); gainXp(40);
      S.hunt = null; S.huntNext = Date.now() + 20 * 60e3; }
    else log(`🧿 Защита ядра не поддалась${emp ? " даже ЭМИ" : " (ЭМИ-граната даёт +35%)"}. Можно пробовать ещё, пока не истекло время.`, "b");
  });
}
function huntTick(now) {

  if (h.found && now > h.found + 15 * 60e3 || now > h.until) { log("🧿 Сигнал ядра пропал — ИИ увёл его в сеть", "b"); S.hunt = null; S.huntNext = now + 10 * 60e3; dirty = true; }
}

/* ----- паёк, мораль, лечение ----- */
const FOOD_IT = ["can", "veg", "rusk"];
function takeRation(k) { if (S.stash[k] > 0) { S.stash[k]--; if (!S.stash[k]) delete S.stash[k]; return true; } if (S.inv[k] > 0) { dec(k); return true; } return false; }
let lastCrewTick = Date.now();
function crewTick(now) {
  if (now - lastCrewTick < 60e3) return; const h = (now - lastCrewTick) / 3600e3; lastCrewTick = now;
  const crew = S.crew || []; if (!crew.length) return;
  S.ration = (S.ration || 0) + crew.length * h * (ctl("park") ? .75 : 1);                // накопленный долг пайков
  let hungry = 0;
  while (S.ration >= 1) { S.ration--; const f = FOOD_IT.some(takeRation), w = takeRation("water"); if (!f || !w) hungry++; }
  const medHeal = (crew.some(m => m.p === "med" && m.st !== "mission") ? 2 : 1) * (ctl("hospital") ? 2 : 1);
  for (const m of [...crew]) {
    if ((m.st === "work" && !(S.cells[m.job] || {}).b) || (m.st === "guard" && !(S.cells[m.job] || {}).o)) unassign(m);
    if (hungry > 0) { m.mo -= 15; hungry--; } else m.mo = Math.min(100, m.mo + 10 * h);
    if (m.st === "hurt") { m.hp = Math.min(100, m.hp + 25 * h * medHeal); if (m.hp >= 70) { m.st = "idle"; log(`⛑ ${m.n} поправился(ась)`, "g"); } }
    if (m.mo <= 0) { crew.splice(crew.indexOf(m), 1); unassign(m); log(`😞 ${m.n} ушёл(ла): нечего есть`, "b"); toast(`${m.n} ушёл(ла) от голода`); }
  }
  if (hungry || crew.some(m => m.mo < 30)) { if (now - (S.hungerWarn || 0) > 20 * 60e3) { S.hungerWarn = now; log("🥫 Отряду не хватает еды и воды на складе", "b"); } }
}

/* ----- вылазки ----- */
const MISSION = {
  scav:  {n:"Добыча",   i:"🎒", d:"обыскать клетку и принести хабар на склад", maxD: 10},
  scout: {n:"Разведка", i:"🔭", d:"разведать местность вокруг клетки, найти ловушки и тайники", maxD: 14},
};
let pickMode = null;    // выбор цели на карте: {type, ids}
function missionCalc(type, ids, i, j) {
  const team = ids.map(crewBy).filter(Boolean), [hi, hj] = hub(), d = cheb(i, j, hi, hj);
  const sum = k => team.reduce((a, m) => a + m.s[k], 0), z = zoneFaction(i, j), h = new Date().getHours(), night = h >= 21 || h < 6;
  const dur = Math.round((type === "scav" ? 4 : 3) + d * 0.8 / (1 + .08 * sum("scout")));     // минуты

  return {team, d, dur, risk, rolls: type === "scav" ? 1 + Math.ceil(sum("scav") / 2) : 0, radius: type === "scout" ? 2 + Math.floor(sum("scout") / 3) : 0};
}

function resolveMission(ms) {

  if (Math.random() < ms.risk) {          // стычка или ловушка

      else { unassign(v); S.crew.splice(S.crew.indexOf(v), 1); notes.push(`💀 ${v.n} погиб(ла)`); toast(`💀 ${v.n} погиб(ла) на вылазке`); }

function craft(id, n = 1) {

    if (left) { S.stash[k] -= left; if (S.stash[k] <= 0) delete S.stash[k]; } }
  const out = Math.floor(r.out[1] * (1 + .25 * coreLv("synth"))) * n, g = addItem(r.out[0], out);
  if (g < out) S.stash[r.out[0]] = (S.stash[r.out[0]] || 0) + out - g;
  bump("crafted"); log(`🔧 Собрано: ${ITEMS[r.out[0]].n} ×${out}${g < out ? " (" + (out - g) + " на склад — рюкзак полон)" : ""}`, "g"); gainXp(Math.min(10, 2 * n)); save(); openBench();
}

const NPC = ["Айгерим","дядя Серик","студенты КазНУ","медсестра Алия","старик Болат","таксист Марат","Жанна с ребёнком","сторож Ерлан"];
function randCellAt(d0, d1, okFn) {
  for (let t = 0; t < 60; t++) {
    const a = S.p.i + rnd(-d1, d1), b = S.p.j + rnd(-d1, d1);
    if (!inGrid(a, b) || !inCity[b * GW + a] || cheb(a, b, S.p.i, S.p.j) < d0) continue;
    if (okFn && !okFn(a, b)) continue; return [a, b];
  }

}

  }

let lastPop = 0;

const RATE = {food: 1 / 45, water: 1 / 30, en: 1 / 6, hp: 1 / 20};
function survive(dtSec, offline) {

  p.water = Math.max(0, p.water - RATE.water * dtSec * meta);
  p.en = Math.min(100, p.en + RATE.en * dtSec * (resting && own ? 3 : 1) * (1 + .25 * pk("stam")));
  if (p.food <= 0 || p.water <= 0) { p.hp -= dtSec / 10; if (offline) p.hp = Math.max(10, p.hp); else if (p.hp <= 0) { p.hp = 0; die(); } }

let gpsWatch = null, gpsFix = null, gpsWeakT = 0;
const GPS_ACC = 60, GPS_EDGE = .15;   // м; доля клетки от границы
function setGps(on) {
  if (on) {
    if (!navigator.geolocation) { toast("GPS недоступен"); return; }
    try {
      gpsWatch = navigator.geolocation.watchPosition(pos => {
        const c = pos.coords, [x, y] = merc(c.longitude, c.latitude); gpsFix = {x, y, acc: c.accuracy, t: Date.now()}; dirty = true;
        if (c.accuracy > GPS_ACC) { if (Date.now() - gpsWeakT > 30e3) { gpsWeakT = Date.now(); toast("GPS: слабый сигнал (±" + Math.round(c.accuracy) + " м), жду точнее"); } return; }
        const fx = (x - OX) / CELL, fy = (y - OY) / CELL, i = Math.floor(fx), j = Math.floor(fy);
        if (!inGrid(i, j) || !inCity[j * GW + i]) { toast(inGrid(i, j) && luOf(i, j) === "W" ? "Вы у воды — клетка недоступна" : "Вы вне карты Алматы"); return; }
        if (i === S.p.i && j === S.p.j) return;
        const edge = Math.min(fx - i, i + 1 - fx, fy - j, j + 1 - fy);   // гистерезис: у самой границы соседней клетки не переключаемся
        if (cheb(i, j, S.p.i, S.p.j) === 1 && edge < GPS_EDGE) return;
        if (fight) return; busy = null; hideProgress(); S.p.i = i; S.p.j = j; enterCell(i, j); centerOnPlayer();
      }, err => { if (err.code === 1) { toast("GPS: доступ запрещён"); setGps(false); } else toast("GPS: ищу сигнал…"); },
      {enableHighAccuracy: true, maximumAge: 3000, timeout: 20000});
      S.gps = true; log("Режим GPS включён", "a");
    } catch (e) { toast("GPS недоступен в этом окне"); S.gps = false; }
  } else { if (gpsWatch !== null) navigator.geolocation.clearWatch(gpsWatch); gpsWatch = null; S.gps = false; }
  document.getElementById("bGps").classList.toggle("on", S.gps); renderAll(); save();
}

  openModal(`<h3>💾 Сохранение</h3><p class="muted">Прогресс хранится только в этом браузере. Выгрузите файл, чтобы сделать копию или перенести игру на другое устройство.</p>
    <div class="acts"><button class="btn acc" onclick="exportSave()">Выгрузить файл<small>day0-save-….json</small></button>
    <button class="btn" onclick="copySave()">Скопировать как текст<small>чтобы переслать в мессенджере</small></button>
    <button class="btn" onclick="document.getElementById('saveFile').click()">Загрузить из файла<small>текущий прогресс будет заменён</small></button>
    <button class="btn" onclick="pasteSaveUI()">Вставить текст сохранения</button>
    <button class="btn" onclick="closeModal()">Закрыть</button></div>`);
}
const saveText = () => JSON.stringify(Object.assign({}, S, {t: Date.now(), app: "day-0"}));
async function exportSave() {
  const name = "day0-save-" + new Date().toISOString().slice(0, 16).replace(/[T:]/g, "-") + ".json";
  const file = new File([saveText()], name, {type: "application/json"});
  try { if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file], title: "Алматы: Сбой — сохранение"}); return; } } catch (e) { if (e.name === "AbortError") return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000); toast("Файл сохранён: " + name);
}
async function copySave() {
  try { await navigator.clipboard.writeText(saveText()); toast("Сохранение скопировано"); }
  catch (e) { openModal(`<h3>Скопируйте текст</h3><textarea readonly style="width:100%;height:40vh;font-size:11px" onfocus="this.select()">${saveText().replace(/</g, "&lt;")}</textarea><div class="acts"><button class="btn" onclick="closeModal()">Готово</button></div>`); }
}
function pasteSaveUI() {
  openModal(`<h3>Вставьте сохранение</h3><textarea id="saveTxt" style="width:100%;height:35vh;font-size:11px" placeholder="{…}"></textarea>
    <div class="acts"><button class="btn acc" onclick="importSave(document.getElementById('saveTxt').value)">Загрузить</button><button class="btn" onclick="closeModal()">Отмена</button></div>`);
}
function importSave(txt) {
  let d; try { d = JSON.parse(txt); } catch (e) { toast("Это не сохранение игры"); return; }
  if (!d || !d.p || typeof d.p.i !== "number" || !d.cells) { toast("Это не сохранение игры"); return; }
  setGps(false); d = migrateCells(d); S = Object.assign(newState(), d); localStorage.setItem(SAVE_KEY, JSON.stringify(S));
  toast("Сохранение загружено"); setTimeout(() => location.reload(), 600);
}
function confirmReset() {
  openModal(`<h3>Начать заново?</h3><p class="muted">Прогресс, территории и рюкзак будут удалены.</p><div class="acts"><button class="btn bad" onclick="doReset()">Да, сбросить</button><button class="btn" onclick="closeModal()">Отмена</button></div>`);
}
function doReset() { setGps(false); S = newState(); ents = []; closeModal(); intro(); enterCell(S.p.i, S.p.j); centerOnPlayer(); }
function renderAll() { document.getElementById("tabDev").style.display = devOn() ? "" : "none"; renderHud(); renderPane(); dirty = true; }
function intro() {
  log("Сбой. Городская ИИ-сеть «Тұмар» захватила энергосистему. ТЭЦ горят, связь мертва.", "a");
  openModal(`<h3>Алматы: Сбой</h3><p>Городская ИИ-сеть вышла из-под контроля. Дроны патрулируют улицы, на рынках правят банды, на дорогах ловушки.</p>
  <p class="muted">• Коснитесь любой клетки: рядом — переход сразу, далеко — персонаж пойдёт сам.<br>• Вверху панели «Действия» всегда есть текущая цель 📌 с наградой.<br>• Обыскивайте, захватывайте клетки, стройте, собирайте людей.<br>• 📡 — режим GPS: ходите по настоящему городу.</p>
  <div class="acts"><button class="btn acc" onclick="closeModal()">Выжить</button></div>`);
}

/* ================== ЦИКЛ ================== */
let lastTick = Date.now(), lastSave = Date.now();
function frame() {
  const now = Date.now();
  if (travel && now - travel.t0 >= travel.dur) arrive();
  if (travel) dirty = true;
  if (busy) {
    const k = Math.min(1, (now - busy.t0) / busy.dur); document.getElementById("pBar").style.width = k * 100 + "%";
    if (k >= 1) { const b = busy; busy = null; hideProgress(); if (b.i === S.p.i && b.j === S.p.j) b.done(); renderAll(); save(); }
  }
  if (now - lastTick >= 1000) {
    const dt = (now - lastTick) / 1000; lastTick = now;
    if (!fight) survive(dt, false);
    if (route && !travel) routeNext();
    populate(); stepEnts(); raids(); buildTick(now); mktTick(now); bldEventTick(now); cacheTick(now); huntTick(now); lostTick(now); crewTick(now); missionTick(now); guideTick(); dirty = true; traderTick(now); eventTick(now); renderHud();
    if (S.pendingPerks > 0 && !fight && document.getElementById("modal").style.display !== "flex") openPerks();
    if ((tab === "act" || tab === "crew") && !busy && document.getElementById("modal").style.display !== "flex") renderPane();
    if (now - lastSave > 10000) { lastSave = now; save(); }
  }
  if (now - lastAnim > 80) { lastAnim = now; dirty = true; }
  if (dirty) draw();
  requestAnimationFrame(frame);
}
window.addEventListener("resize", resize);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

/* ================== СТАРТ ================== */
resize();
centerOnPlayer(); cam.s = 0.12;
{ const v = sessionStorage.getItem("devView"); if (v) { sessionStorage.removeItem("devView"); try { const d = JSON.parse(v); cam.x = d.x; cam.y = d.y; cam.s = d.s; devTool = d.tool; setTimeout(() => setTab("dev")); } catch (e) {} } }
const firstRun = !S.log.length;
if (firstRun) intro();
storyStart();
migrateBuild();
if (!S.crewGift) { S.crewGift = 1; const m = newSurvivor("scav"); m.n = "Айдар"; joinCrew(m);
  log("Сауле: «Возьми Айдара, он знает район. Отправляй его за хабаром — вкладка «Люди»»", "a"); }
reveal(S.p.i, S.p.j, 1, false);
if (S.gps) { S.gps = false; setGps(true); }
renderAll();
requestAnimationFrame(frame);
try { if ("serviceWorker" in navigator && location.protocol === "https:" && window.top === window.self) navigator.serviceWorker.register("sw.js").catch(() => {}); } catch (e) {}
</script>
